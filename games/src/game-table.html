<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="color-scheme" content="dark"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'"><title>Maroon Games</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#121114;color:#f3ece5;font:14px -apple-system,BlinkMacSystemFont,sans-serif}body{display:flex;flex-direction:column;padding:8px 12px 10px;gap:7px}button,input,select{font:inherit}button,select{border:0;border-radius:10px;background:#302b30;color:#f3ece5;min-height:38px;padding:6px 12px;font-weight:650}button:disabled{opacity:.45}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #fff4e9}#top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px;height:auto;flex-shrink:0}#score{font-size:12px;color:#bfb2b6;white-space:pre-line;line-height:1.45}#turn{font-weight:750;font-size:15px}#stage{position:relative;flex:1;min-height:140px;border-radius:22px;overflow:hidden;background:radial-gradient(ellipse at 50% 20%,#34403e,#172221 85%);box-shadow:inset 0 0 30px #0004}canvas{display:block;width:100%;height:100%;touch-action:none}#hint{position:absolute;bottom:9px;left:10px;right:10px;text-align:center;font-size:11px;color:#fff;background:#122721d9;border-radius:8px;padding:5px;pointer-events:none}#toast{position:absolute;top:10px;left:14px;right:14px;color:#fff;text-align:center;font-weight:600;background:#0005;border-radius:9px;padding:7px;pointer-events:none}#controls{display:flex;flex-direction:column;gap:7px}#status{min-height:30px;text-align:center;font-size:12px;line-height:1.3;color:#c9bbc0}#powerrow{display:flex;gap:8px;align-items:center}#power{accent-color:#500000;flex:1;min-width:50px;height:30px}#powerValue{font-variant-numeric:tabular-nums;min-width:34px;font-size:12px}#actionrow{display:flex;gap:7px}#shoot{background:#500000;color:#fff4e9;flex:1;min-height:43px}#aimrow{display:flex;align-items:center;gap:8px}#aim{accent-color:#500000;width:100%;min-width:50px}label{font-size:11px;font-weight:650;white-space:nowrap}#footer{display:flex;justify-content:space-between;align-items:center;color:#afa0a6;font-size:10px}#reset,#sound,#replayShot{font-size:11px;min-height:28px;padding:3px 9px;background:transparent}#rules{position:absolute;inset:8px;background:#19181bed;border-radius:17px;padding:20px;overflow:auto;z-index:5;display:none;line-height:1.6}#rules h2{font-size:21px;line-height:1.2;color:#fff4e9}#rules button{background:#500000;color:#fff4e9}#legal{display:none;max-height:96px;overflow:auto;gap:4px;flex-wrap:wrap}#legal button{font-size:12px;min-height:32px}#promotion{display:none}#ballInHand{display:none;background:#c4a66d;color:#311c11}#ruleButton{font-size:11px;min-height:30px;background:transparent;color:#eee9}#viewButtons{position:absolute;right:4px;top:4px;display:flex}#camera{background:transparent;color:#eee9;font-size:11px;min-height:30px}
#shoot,#closeRules{border:1px solid #a87979}input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:32px}input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:#726169}input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;background:#500000;border:2px solid #fff4e9}
</style></head><body><div id="top"><div><div id="turn">Preparing table…</div><div id="score"></div></div><button id="sound" aria-label="Toggle game sound">Sound off</button></div><div id="stage"><canvas id="table" aria-label="Game table. Touch to aim; pull back and release to shoot."></canvas><div id="viewButtons"><button id="camera">Overhead</button><button id="ruleButton">Rules</button></div><div id="toast"></div><div id="hint"></div><div id="rules"><h2 id="rulesTitle"></h2><p id="rulesText"></p><button id="closeRules">Back to game</button></div></div><div id="controls"><div id="status" role="status" aria-live="polite"></div><div id="aimrow"><label for="aim">AIM</label><button id="left" aria-label="Aim left">−</button><input id="aim" type="range" min="-180" max="180" step=".2" value="0" aria-label="Aim angle"><button id="right" aria-label="Aim right">+</button></div><div id="powerrow"><label for="power">POWER</label><input id="power" type="range" min="3" max="100" value="65" aria-label="Shot power"><span id="powerValue">65%</span></div><div id="actionrow"><button id="ballInHand">Place cue</button><select id="throwType" aria-label="Throw style"><option value="arc">Arc throw</option><option value="bounce">Bounce throw</option></select><select id="promotion" aria-label="Promotion piece"><option value="q">Queen</option><option value="r">Rook</option><option value="b">Bishop</option><option value="n">Knight</option></select><button id="shoot">Shoot</button></div><div id="legal"></div></div><div id="footer"><button id="reset">New local game</button><button id="replayShot" disabled>Replay last shot</button></div><script src="game-runtime.js"></script></body></html>
