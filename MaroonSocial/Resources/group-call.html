<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; media-src blob:; connect-src https: wss:"><style>
:root{color-scheme:dark}body{margin:0;background:#1a1417;color:#fbf7ed;font:14px -apple-system,sans-serif}#tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}.tile{position:relative;aspect-ratio:3/4;border-radius:16px;background:#30262c;overflow:hidden}.tile video{width:100%;height:100%;object-fit:cover}.label{position:absolute;bottom:8px;left:10px;background:#1a1417bb;padding:4px 8px;border-radius:8px}.placeholder{position:absolute;inset:0;display:grid;place-items:center;font-size:32px}#local video{transform:scaleX(-1)}#controls{display:flex;justify-content:center;gap:12px;padding:12px}button{font:600 14px -apple-system;background:#500000;color:#fbf7ed;border:0;border-radius:20px;padding:12px 18px}.muted{background:#5b5157}body.voice .tile{aspect-ratio:2/1}#status{padding:8px 16px;text-align:center;color:#cdc3c8;font-size:12px}</style></head><body><div id="tiles"></div><div id="controls"><button id="mic" aria-label="Mute microphone">Mute</button><button id="camera" aria-label="Turn camera off">Camera off</button></div><div id="status">Preparing call…</div><script>
(()=>{'use strict';let config,stream,generation=0,started=false,stopped=true,chain=Promise.resolve();const peers=new Map(),candidates=new Map(),seen=new Set();
const post=x=>window.webkit?.messageHandlers.maroonGroup?.postMessage(x),status=x=>{document.getElementById('status').textContent=x;post({type:'status',value:x})};
const emit=(to,kind,payload)=>post({type:'signal',to,kind,payload});
function tile(id,label,local=false){let el=document.getElementById(id);if(!el){el=document.createElement('div');el.id=id;el.className='tile';let placeholder=document.createElement('div');placeholder.className='placeholder';placeholder.textContent='●';el.append(placeholder);let video=document.createElement('video');video.autoplay=true;video.playsInline=true;video.muted=local;el.append(video);let name=document.createElement('span');name.className='label';el.append(name);document.getElementById('tiles').append(el)}el.querySelector('.label').textContent=label;return el}
function closePeer(seat){const entry=peers.get(seat);if(entry){clearTimeout(entry.timeout);entry.pc.onicecandidate=null;entry.pc.ontrack=null;entry.pc.onconnectionstatechange=null;entry.pc.close();peers.delete(seat)}candidates.delete(seat);document.getElementById('peer-'+seat)?.remove()}
function stop(){generation++;stopped=true;started=false;for(const seat of [...peers.keys()])closePeer(seat);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;document.querySelectorAll('video').forEach(v=>v.srcObject=null);document.getElementById('tiles').replaceChildren();candidates.clear();seen.clear();chain=Promise.resolve()}
function fail(message){status(message);post({type:'failure',value:message});stop()}
async function budget(pc){for(const sender of pc.getSenders()){if(!sender.track)continue;const p=sender.getParameters();if(!p.encodings?.length)p.encodings=[{}];for(const e of p.encodings){e.maxBitrate=sender.track.kind==='video'?350000:24000;if(sender.track.kind==='video')e.maxFramerate=18}try{await sender.setParameters(p)}catch{}}}
async function createPeer(person){if(peers.has(person.seat)||person.seat===config.mySeat||stopped)return peers.get(person.seat);const epoch=generation,pc=new RTCPeerConnection({iceServers:config.iceServers,iceTransportPolicy:config.transport==='direct'?'all':'relay'}),entry={pc,timeout:null};peers.set(person.seat,entry);const el=tile('peer-'+person.seat,person.alias);for(const track of stream.getTracks())pc.addTrack(track,stream);await budget(pc);
pc.onicecandidate=e=>{if(e.candidate&&!stopped&&epoch===generation)emit(person.seat,'ice',e.candidate.toJSON())};pc.ontrack=e=>{if(stopped||epoch!==generation)return;el.querySelector('video').srcObject=e.streams[0];el.querySelector('video').play().catch(()=>{});if(e.track.kind==='video')el.querySelector('.placeholder').style.display='none'};
pc.onconnectionstatechange=()=>{if(epoch!==generation)return;if(pc.connectionState==='connected'){clearTimeout(entry.timeout);status('Connected')}else if(pc.connectionState==='failed'){fail('This network could not connect the group call. Try another Wi-Fi or mobile network; some networks require a relay.')}};
entry.timeout=setTimeout(()=>{if(epoch===generation&&pc.connectionState!=='connected')fail('Connection timed out. Try another network. Wi-Fi alone does not guarantee a direct connection.')},30000);
if(config.mySeat.localeCompare(person.seat)<0){await pc.setLocalDescription(await pc.createOffer());if(epoch===generation&&!stopped)emit(person.seat,'offer',pc.localDescription.toJSON())}return entry}
async function roster(people){if(stopped||!stream)return;const allowed=new Set(people.filter(p=>p.seat!==config.mySeat).map(p=>p.seat));for(const seat of [...peers.keys()])if(!allowed.has(seat))closePeer(seat);for(const person of people){if(person.seat===config.mySeat)continue;await createPeer(person);tile('peer-'+person.seat,person.alias)}}
async function receive(s){if(stopped||!stream||seen.has(s.id))return;seen.add(s.id);const person=config.people.find(p=>p.seat===s.from);if(!person)return;const entry=await createPeer(person);if(!entry)return;const pc=entry.pc;if(s.kind==='ice'){if(pc.remoteDescription)await pc.addIceCandidate(s.payload);else{const list=candidates.get(s.from)||[];if(list.length<100){list.push(s.payload);candidates.set(s.from,list)}}return}if(s.kind==='offer'||s.kind==='answer'){await pc.setRemoteDescription(s.payload);for(const candidate of candidates.get(s.from)||[])await pc.addIceCandidate(candidate);candidates.delete(s.from);if(s.kind==='offer'){await pc.setLocalDescription(await pc.createAnswer());emit(s.from,'answer',pc.localDescription.toJSON())}}}
async function start(c){stop();config=c;stopped=false;const epoch=generation;document.body.classList.toggle('voice',!c.video);document.getElementById('camera').hidden=!c.video;try{const capture=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:c.video?{width:{ideal:480,max:640},height:{ideal:360,max:480},frameRate:{ideal:18,max:18},facingMode:'user'}:false});if(stopped||epoch!==generation){capture.getTracks().forEach(t=>t.stop());return}stream=capture;const local=tile('local','You',true);local.querySelector('video').srcObject=stream;if(c.video)local.querySelector('.placeholder').style.display='none';started=true;await roster(c.people);status('Connecting…')}catch{if(epoch===generation)fail('Camera or microphone could not start. Check iPhone permissions and retry.')}}
window.MaroonGroup={start,stop,update:async value=>{config.people=value.people;chain=chain.then(async()=>{if(!started||stopped)return;await roster(value.people);for(const signal of value.signals)await receive(signal)}).catch(()=>fail('The call connection was interrupted. Leave and try again.'));return chain}};
document.getElementById('mic').onclick=()=>{if(!stream)return;const enabled=!stream.getAudioTracks()[0]?.enabled;stream.getAudioTracks().forEach(t=>t.enabled=enabled);document.getElementById('mic').textContent=enabled?'Mute':'Unmute';document.getElementById('mic').classList.toggle('muted',!enabled)};
document.getElementById('camera').onclick=()=>{if(!stream)return;const enabled=!stream.getVideoTracks()[0]?.enabled;stream.getVideoTracks().forEach(t=>t.enabled=enabled);document.getElementById('camera').textContent=enabled?'Camera off':'Camera on';document.getElementById('camera').classList.toggle('muted',!enabled)};
window.addEventListener('pagehide',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});})();
</script></body></html>
